services:
  postgres:
    image: postgres:16-alpine
    container_name: valli_postgres
    environment:
      POSTGRES_USER: valli
      POSTGRES_PASSWORD: valli_dev_password
      POSTGRES_DB: valli_securepay
    ports:
      - "5433:5432"
    volumes:
      - valli_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valli -d valli_securepay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: valli_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: valli_backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://valli:valli_dev_password@postgres:5432/valli_securepay
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

volumes:
  valli_pg_data:
