services:
  postgres:
    image: postgres:16-alpine
    container_name: valli_postgres
    environment:
      POSTGRES_USER: valli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: valli_securepay
    volumes:
      - valli_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valli -d valli_securepay"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: valli_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: valli_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://valli:${POSTGRES_PASSWORD}@postgres:5432/valli_securepay
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Both unset -> the model baked into this image at build time (see
      # backend/Dockerfile). Both set -> loaded from S3 at boot instead --
      # MODEL_S3_KEY must name one specific pinned artifact, never a
      # "latest.pkl". Credentials come from the EC2 instance's IAM role,
      # never from an env var here.
      MODEL_S3_BUCKET: ${MODEL_S3_BUCKET:-}
      MODEL_S3_KEY: ${MODEL_S3_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: valli_worker
    command: ["python", "-m", "app.workers.run_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://valli:${POSTGRES_PASSWORD}@postgres:5432/valli_securepay
      REDIS_URL: redis://redis:6379/0
      MODEL_S3_BUCKET: ${MODEL_S3_BUCKET:-}
      MODEL_S3_KEY: ${MODEL_S3_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        API_BASE_URL: ""
    container_name: valli_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  valli_pg_data:
