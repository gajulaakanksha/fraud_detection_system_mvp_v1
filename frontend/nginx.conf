server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing — any non-file path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy: the browser only ever talks to this origin,
    # so the backend's CORS config never comes into play for this deployment.
    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # FastAPI's Swagger UI and OpenAPI schema live at the root, not under
    # /v1/ -- proxied explicitly so the API explorer is reachable on the
    # same address as everything else, not just via a separately-opened port.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
