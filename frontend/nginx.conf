# Docker's embedded DNS -- re-resolving `backend` here (valid=10s) instead of
# letting nginx cache whatever IP it got at startup is what keeps this
# working after `docker compose up -d --build` recreates the backend
# container (new container = new internal IP) without also restarting
# nginx. A bare `proxy_pass http://backend:8000` resolves once at startup
# and silently 502s against the old, dead IP after any backend redeploy.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing — any non-file path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy: the browser only ever talks to this origin,
    # so the backend's CORS config never comes into play for this deployment.
    # $backend_upstream (a variable, not a literal) is what forces nginx to
    # use the resolver above per-request instead of caching the address.
    location /v1/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # FastAPI's Swagger UI and OpenAPI schema live at the root, not under
    # /v1/ -- proxied explicitly so the API explorer is reachable on the
    # same address as everything else, not just via a separately-opened port.
    location /docs {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }
}
